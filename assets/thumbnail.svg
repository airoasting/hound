<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"
     font-family="'Hoefler Text','Iowan Old Style','Georgia',serif">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="630"/></clipPath>
  </defs>

  <!-- field-ink ground (warm loden black, no gradient) -->
  <rect width="1200" height="630" fill="#14160F"/>

  <!-- surveyor grid -->
  <g stroke="#EDE7D6" stroke-width="1" opacity="0.05">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200 M0 360H1200 M0 400H1200 M0 440H1200 M0 480H1200 M0 520H1200 M0 560H1200"/>
    <path d="M40 0V630 M80 0V630 M120 0V630 M160 0V630 M200 0V630 M240 0V630 M280 0V630 M320 0V630 M360 0V630 M400 0V630 M440 0V630 M480 0V630 M520 0V630 M560 0V630 M600 0V630 M640 0V630 M680 0V630 M720 0V630 M760 0V630 M800 0V630 M840 0V630 M880 0V630 M920 0V630 M960 0V630 M1000 0V630 M1040 0V630 M1080 0V630 M1120 0V630 M1160 0V630"/>
  </g>

  <!-- plate frame -->
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#EDE7D6" stroke-width="1" opacity="0.22"/>
  <!-- corner registration crosshairs -->
  <g stroke="#EDE7D6" stroke-width="1.2" opacity="0.55">
    <path d="M44 32V56 M32 44H56"/>
    <path d="M1156 32V56 M1144 44H1168"/>
    <path d="M44 574V598 M32 586H56"/>
    <path d="M1156 574V598 M1144 586H1168"/>
  </g>

  <!-- ================= HERO: scent contour + lock ================= -->
  <g transform="translate(322 306)" fill="none" stroke="#EDE7D6" stroke-linejoin="round">
    <ellipse cx="0" cy="0" rx="196" ry="182" transform="rotate(-8)" stroke-width="1" opacity="0.12"/>
    <ellipse cx="2" cy="-3" rx="162" ry="150" transform="rotate(6)" stroke-width="1" opacity="0.18"/>
    <ellipse cx="-2" cy="2"  rx="128" ry="120" transform="rotate(-4)" stroke-width="1.4" opacity="0.30"/>
    <ellipse cx="3" cy="-2"  rx="96"  ry="90"  transform="rotate(9)"  stroke-width="1" opacity="0.42"/>
    <ellipse cx="-1" cy="1"  rx="64"  ry="61"  transform="rotate(-3)" stroke-width="1" opacity="0.55"/>
    <ellipse cx="0" cy="0"   rx="34"  ry="33"  stroke-width="1.4" opacity="0.7" stroke="#EDE7D6"/>
    <!-- contour index labels (elevation-style) -->
    <text x="120" y="-118" font-family="'SF Mono','Menlo',monospace" font-size="12"
          fill="#EDE7D6" stroke="none" opacity="0.45" letter-spacing="1">·280</text>
    <text x="-150" y="96" font-family="'SF Mono','Menlo',monospace" font-size="12"
          fill="#EDE7D6" stroke="none" opacity="0.4" letter-spacing="1">·120</text>
  </g>

  <!-- lock / bite point -->
  <g transform="translate(322 306)">
    <circle r="19" fill="none" stroke="#C0402F" stroke-width="1.5"/>
    <path d="M0 -30V-11 M0 11V30 M-30 0H-11 M11 0H30" stroke="#C0402F" stroke-width="1.5"/>
    <circle r="6.5" fill="#C0402F"/>
  </g>

  <!-- scent trail: dotted survey line from lock toward wordmark -->
  <path d="M341 306 C 430 300, 470 250, 560 232" fill="none" stroke="#EDE7D6"
        stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.5 11" opacity="0.5"/>
  <g stroke="#EDE7D6" stroke-width="1" opacity="0.35">
    <path d="M436 296l-6 12 M486 262l-6 12"/>
  </g>
  <text x="392" y="338" font-family="'SF Mono','Menlo',monospace" font-size="12"
        fill="#EDE7D6" opacity="0.4" letter-spacing="1">37.5665, 126.9780</text>

  <!-- ================= WORDMARK ================= -->
  <!-- top eyebrow -->
  <text x="620" y="108" font-family="'SF Mono','Menlo',monospace" font-size="15"
        fill="#EDE7D6" opacity="0.6" letter-spacing="4">SCENT-TRACKING SEARCH</text>
  <text x="1112" y="108" font-family="'SF Mono','Menlo',monospace" font-size="15"
        fill="#EDE7D6" opacity="0.45" letter-spacing="2" text-anchor="end">FIELD CARD / No.01</text>
  <line x1="620" y1="126" x2="1112" y2="126" stroke="#EDE7D6" stroke-width="1" opacity="0.2"/>

  <!-- display -->
  <text x="614" y="298" font-size="150" font-weight="700" fill="#EDE7D6" letter-spacing="-3">Hound</text>
  <text x="622" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="30" font-weight="500" fill="#EDE7D6" opacity="0.72" letter-spacing="2">사냥개 · 무조건 SEARCH</text>

  <!-- oxblood seal: 물면 안 놓는다 -->
  <g transform="translate(620 392)">
    <rect x="0" y="0" width="10" height="46" fill="#C0402F"/>
    <text x="30" y="37" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
          font-size="40" font-weight="800" fill="#EDE7D6" letter-spacing="1">물면 안 놓는다</text>
  </g>

  <!-- ================= BOTTOM MANIFEST ================= -->
  <line x1="620" y1="470" x2="1112" y2="470" stroke="#EDE7D6" stroke-width="1" opacity="0.2"/>
  <text x="620" y="512" font-family="'SF Mono','Menlo',monospace" font-size="16"
        fill="#EDE7D6" opacity="0.72" letter-spacing="1">16 CHANNELS</text>
  <text x="620" y="540" font-family="'SF Mono','Menlo',monospace" font-size="13"
        fill="#EDE7D6" opacity="0.45" letter-spacing="0.5">NAVER · YOUTUBE · X · REDDIT · GITHUB · RSS · +10 MORE</text>
  <text x="1112" y="512" font-family="'SF Mono','Menlo',monospace" font-size="16"
        fill="#EDE7D6" opacity="0.5" letter-spacing="2" text-anchor="end">MIT</text>
</svg>
