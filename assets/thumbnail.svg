<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"
     font-family="'Hoefler Text','Iowan Old Style','Georgia',serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34291E"/>
      <stop offset="0.5" stop-color="#211A1C"/>
      <stop offset="1" stop-color="#0E0B10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.29" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0A768" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E0A768" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3A863"/>
      <stop offset="1" stop-color="#A66C2C"/>
    </linearGradient>
    <linearGradient id="coatDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B07E3E"/>
      <stop offset="1" stop-color="#7E501F"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F5A2A"/>
      <stop offset="1" stop-color="#5E3A1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C079"/>
      <stop offset="1" stop-color="#B98A45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="340" cy="310" rx="430" ry="360" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="506" rx="196" ry="24" fill="#000000" opacity="0.32"/>

  <!-- ================= HOUND (standing profile, facing right) ================= -->
  <g>
    <!-- tail: sabre, up and back -->
    <path d="M176 322 C 150 300, 134 262, 138 236 C 152 244, 166 270, 182 300
             C 190 314, 186 326, 176 322 Z" fill="url(#coat)"/>

    <!-- far legs (darker for depth) -->
    <path d="M214 372 h20 l-3 128 h-16 z" fill="url(#coatDark)"/>
    <ellipse cx="222" cy="502" rx="13" ry="7" fill="url(#coatDark)"/>
    <path d="M356 366 h19 l-2 134 h-15 z" fill="url(#coatDark)"/>
    <ellipse cx="364" cy="502" rx="13" ry="7" fill="url(#coatDark)"/>

    <!-- torso: level topline, deep chest, tucked belly -->
    <path d="M170 330
             C 162 306, 176 292, 200 290
             C 250 284, 316 286, 360 292
             C 384 296, 400 306, 408 326
             C 416 348, 414 368, 400 380
             C 384 392, 360 394, 336 392
             C 316 390, 300 384, 292 372
             C 280 384, 258 388, 236 388
             C 210 388, 186 380, 176 362
             C 168 350, 168 340, 170 330 Z" fill="url(#coat)"/>

    <!-- near legs -->
    <!-- near hind: thigh + shank -->
    <path d="M196 336 C 224 330, 248 348, 250 386 C 250 402, 242 410, 234 410
             C 240 440, 240 476, 238 500 h-20 C 218 470, 214 430, 210 400
             C 196 388, 186 366, 190 348 C 191 342, 193 338, 196 336 Z" fill="url(#coat)"/>
    <ellipse cx="228" cy="502" rx="14" ry="7.5" fill="url(#coat)"/>
    <!-- near fore: straight column -->
    <path d="M372 372 h22 l-3 128 h-18 z" fill="url(#coat)"/>
    <ellipse cx="381" cy="502" rx="14" ry="7.5" fill="url(#coat)"/>

    <!-- neck + head + muzzle -->
    <path d="M372 300
             C 388 276, 404 256, 424 246
             C 446 236, 470 240, 482 252
             C 470 258, 452 258, 440 262
             C 468 266, 500 272, 516 284
             C 528 293, 526 302, 512 304
             C 496 306, 476 302, 462 298
             C 456 314, 442 326, 424 330
             C 404 334, 386 328, 378 316
             C 372 310, 370 304, 372 300 Z" fill="url(#coat)"/>

    <!-- long droopy ear -->
    <path d="M430 258
             C 410 268, 398 300, 400 336
             C 401 358, 416 368, 432 362
             C 444 357, 448 330, 448 302
             C 448 282, 442 264, 436 256 Z" fill="url(#ear)"/>

    <!-- nose, eye, brow -->
    <circle cx="516" cy="290" r="8.5" fill="#241710"/>
    <circle cx="470" cy="266" r="7" fill="#241710"/>
    <circle cx="472.4" cy="263.6" r="2.2" fill="#EBDCC0"/>
    <path d="M456 252 C 464 248, 476 248, 484 252" stroke="#6E441F" stroke-width="2.6"
          fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- mouth line -->
    <path d="M512 296 C 500 302, 486 302, 476 300" stroke="#6E441F" stroke-width="2"
          fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- topline highlight -->
    <path d="M200 296 C 262 289, 330 291, 372 298" stroke="#F0C892" stroke-width="3"
          fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <text x="636" y="152" font-family="'SF Mono','Menlo',monospace" font-size="17"
        fill="#E8C079" opacity="0.85" letter-spacing="6">SCENT-TRACKING SEARCH</text>

  <text x="632" y="332" font-size="150" font-weight="700" fill="#F4ECDD" letter-spacing="-3">Hound</text>

  <line x1="640" y1="374" x2="1096" y2="374" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

  <text x="640" y="432" font-size="44" font-style="italic" fill="#F4ECDD" opacity="0.92">Never loses the trail.</text>

  <text x="640" y="488" font-family="'SF Mono','Menlo',monospace" font-size="17"
        fill="#F4ECDD" opacity="0.5" letter-spacing="1.5">Relentless search across 16 channels</text>
</svg>
